<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 计算器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 32px;
            width: 420px;
            max-width: 95vw;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .input-row input {
            flex: 1;
            padding: 10px 14px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-row input:focus {
            border-color: #4a90d9;
        }
        .input-row button {
            padding: 10px 20px;
            font-size: 16px;
            background: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-row button:hover {
            background: #357abd;
        }
        .result {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 20px;
            min-height: 48px;
            display: flex;
            align-items: center;
            font-size: 18px;
            color: #333;
            word-break: break-all;
        }
        .result.error {
            color: #d9534f;
            background: #fff5f5;
        }
        .history-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
        }
        .history-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .history-list li {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
            color: #555;
            border-bottom: 1px solid #f5f5f5;
        }
        .history-list li:last-child {
            border-bottom: none;
        }
        .history-list .expr {
            color: #888;
        }
        .history-list .val {
            color: #333;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Web 计算器</h1>
        <div class="input-row">
            <input
                id="expression"
                type="text"
                placeholder="输入表达式，如 3 + 5 * 2"
                autofocus
            />
            <button id="calc-btn">计算</button>
        </div>
        <div class="result" id="result"></div>
        <div class="history-title">计算历史</div>
        <ul class="history-list" id="history"></ul>
    </div>

    <script>
        const expressionInput = document.getElementById("expression");
        const calcBtn = document.getElementById("calc-btn");
        const resultDiv = document.getElementById("result");
        const historyList = document.getElementById("history");

        function refreshHistory() {
            fetch("/api/history")
                .then(res => res.json())
                .then(data => {
                    historyList.innerHTML = "";
                    data.history.slice().reverse().forEach(item => {
                        const li = document.createElement("li");
                        li.innerHTML = `<span class="expr">${item.expression}</span><span class="val">= ${item.result}</span>`;
                        historyList.appendChild(li);
                    });
                });
        }

        function calculate() {
            const expression = expressionInput.value.trim();
            if (!expression) return;

            resultDiv.textContent = "计算中...";
            resultDiv.className = "result";

            fetch("/api/calculate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ expression }),
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        resultDiv.textContent = `${data.expression} = ${data.result}`;
                        resultDiv.className = "result";
                    } else {
                        resultDiv.textContent = data.error;
                        resultDiv.className = "result error";
                    }
                    refreshHistory();
                });
        }

        calcBtn.addEventListener("click", calculate);
        expressionInput.addEventListener("keydown", e => {
            if (e.key === "Enter") calculate();
        });

        refreshHistory();
    </script>
</body>
</html>
